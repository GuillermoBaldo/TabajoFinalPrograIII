<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="./principal.js"></script>
    <script defer src="./crud.js"></script>
    <link rel="stylesheet" href="./css/styles.css">
    <title>tiendaDeRopa</title>
    <style>
        /* FONDO DEL MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #00000080;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* CONTENIDO */
        .contenido-modal {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contenido-modal form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .botones-modal {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .botones-modal button {
            flex: 1;
        }

        /* MODO OSCURO */
        body.dark-mode .contenido-modal {
            background: #1e1e1e;
            color: white;
        }

        .contenido-modal select {
            padding: 12px;
            border-radius: 7px;
            border: 1px solid #ddd;
            font-family: inherit;
            background: white;
        }
    </style>

</head>

<body>
    <header>
        <div class="marca">
            <img src="./img/Logo Minimalista N con Órbita y Estrella.png" alt="icono">
            <h1>Nøva</h1>
        </div>

        <nav class="navegador">
            <ul class="lista">
                <li><a href="principal.html">Principal</a></li>
                <li><a href="crear.html">Crear</a></li>
            </ul>
        </nav>

        <div>
            <button id="theme-toggle" class="theme-toggle-btn">
                Modo Oscuro
            </button>
        </div>
    </header>
    <main>
        <div>
            <h1>Productos</h1>
        </div>
        <form id="buscador">
            <label for="idProd">Id producto</label>
            <input type="number" name="id" id="idProd" required>

            <input type="submit" value="Consultar">
            <button type="button" id="btn-crear">Crear producto</button>
        </form>
        <div id="modal-crear" class="modal">

            <div class="contenido-modal">

                <h2>Crear producto</h2>

                <form id="form-crear">

                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>

                    <label for="precio">Precio</label>
                    <input type="number" id="precio" name="precio" min="1" required>

                    <label for="categoria">Categoría</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Seleccionar categoría</option>
                        <option value="Invierno">Invierno</option>
                        <option value="Verano">Verano</option>
                    </select>

                    <label for="imagen">Imagen (URL)</label>
                    <input type="text" id="imagen" name="imagen" required>

                    <div class="botones-modal">
                        <button type="submit">Crear producto</button>
                        <button type="button" id="cerrar-modal">Cancelar</button>
                    </div>

                </form>

            </div>
        </div>
        <section id="contenedor-productos"></section>
        <section id="lista-productos">

        </section>
        <section>
            <h2>Agregar Producto</h2>
            <form id="form-agregar">
                <input type="text" id="nombre" placeholder="Nombre" required>
                <input type="text" id="imagen" placeholder="Imagen" required>
                <input type="text" id="categoria" placeholder="Categoría" required>
                <input type="number" id="precio" placeholder="Precio" required>
                <button type="submit">Agregar</button>
            </form>
        </section>
    </main>
    <footer>

    </footer>
</body>

</html>
