<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="principal.js"></script>
    <link rel="stylesheet" href="./css/styles.css">
    <title>tiendaDeRopa</title>
    <script defer src="crud.js"></script>
</head>

<body>
    <header>
        <div>
            <img src="" alt="icono">
        </div>
        <nav class="navegador">
            <ul class="lista">
                <li><a href="principal.html">Principal</a></li>
                <li>Crear</li>
                
            </ul>
        </nav>
        <div>
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Cambiar tema"> Modo Oscuro</button>
        </div>
    </header>
    <main>
        <div>
            <h1>Productos</h1>
        </div>
        <form id="buscador">
            <label for="idProd">Id producto</label>
            <input type="number" name="id" id="idProd" min="1" required>

            <input type="submit" value="Consultar">
        </form>
        <section id="lista-productos">
        
        </section>
        <section>
            <h2>Agregar Producto</h2>
            <form id="form-agregar">
                <input type="text" id="nombre" placeholder="Nombre" required>
                <input type="text" id="imagen" placeholder="Imagen" required>
                <input type="text" id="categoria" placeholder="Categoría" required>
                <input type="number" id="precio" placeholder="Precio" required>
                <button type="submit">Agregar</button>
            </form>
        </section>
    </main>
    <footer>

    </footer>
</body>

</html>
